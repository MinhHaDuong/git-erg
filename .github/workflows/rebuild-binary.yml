name: Rebuild bootstrap binary

on:
  push:
    branches: [main]
    # Anything the binary is built from — Go sources, go.mod/go.sum, AND the
    # //go:embed assets under src/go/assets/. An asset-only change (e.g. the
    # 0160 corrupted-AGENTS.md fix) must rebuild too, or the committed binary
    # ships stale embedded files. The "Binary unchanged" guard below makes a
    # no-op rebuild (e.g. test-only edits) harmless.
    paths:
      - 'src/go/**'

concurrency:
  group: rebuild-binary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Rebuild bootstrap binary
        run: make update-bootstrap-binary

      - name: Commit if binary changed
        run: |
          if git diff --exit-code tickets/erg; then
            echo "Binary unchanged — no commit needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tickets/erg
            git commit -m "chore: rebuild bootstrap binary [skip ci]"
            git push
          fi
